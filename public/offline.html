<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Offline · Rift Ledger</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fbfaf7; color: #16181d; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
      main { max-width: 340px; padding: 24px; text-align: center; }
      img { width: 64px; height: 64px; }
      h1 { font-size: 18px; margin: 16px 0 4px; }
      p { color: #626873; margin: 0 0 16px; }
      button { height: 36px; padding: 0 16px; border: 0; border-radius: 4px; background: #1f4fb5; color: #fff; font: inherit; font-weight: 500; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon.svg" alt="" />
      <h1>You're offline</h1>
      <p>Rift Ledger needs a connection to show current prices. Your data is safe — try again when you're back online.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
