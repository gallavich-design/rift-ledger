# Daily card + price refresh for a deployed Rift Ledger.
# Uses the CRON_SECRET secret, and APP_URL (secret) or, if unset, https://<FLY_APP variable>.fly.dev.
# Skipped until CRON_SECRET is set.
name: Daily sync
on:
  schedule:
    - cron: "15 21 * * *" # 04:15 Bangkok, after tcgcsv refreshes (~20:00 UTC)
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      URL: ${{ secrets.APP_URL || format('https://{0}.fly.dev', vars.FLY_APP) }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Cards and prices
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET not set — skipping."; exit 0; fi
          curl -fsS -m 300 -H "Authorization: Bearer $CRON_SECRET" "$URL/api/cron/sync-cards"
          echo
          curl -fsS -m 300 -H "Authorization: Bearer $CRON_SECRET" "$URL/api/cron/sync-prices"
